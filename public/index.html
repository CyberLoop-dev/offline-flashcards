<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Flashcards</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><header><span>STUDY / LOCAL</span><h1>Offline <em>Flashcards</em></h1><p>Your cards stay in this browser.</p></header><section class="editor"><h2>Create a card</h2><form id="card-form"><input id="front" placeholder="Question" required maxlength="240"><textarea id="back" placeholder="Answer" required maxlength="1200"></textarea><button>Add card</button></form><div class="tools"><button id="export">Export JSON</button><label class="file">Import JSON<input id="import" type="file" accept="application/json"></label></div></section><section class="review"><div class="section-head"><h2>Review queue</h2><span id="count">0 cards</span></div><article id="study-card" class="study-card"><p class="muted">No cards due. Add a card to begin.</p></article><div id="ratings" class="ratings" hidden><button data-rating="again">Again</button><button data-rating="good">Good</button><button data-rating="easy">Easy</button></div></section><section><h2>Your deck</h2><ul id="deck"></ul></section><footer>Offline-first • No account • No tracking</footer></main><script type="module" src="/app.js"></script></body></html>
